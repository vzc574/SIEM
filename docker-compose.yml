services:
  siem:
    build: .
    ports:
      - "8080:8080"
    environment:
      SIEM_API_KEY: ${SIEM_API_KEY:-}
      SIEM_API_KEYS: ${SIEM_API_KEYS:-}
      SIEM_TRUSTED_PROXIES: ${SIEM_TRUSTED_PROXIES:-}
    volumes:
      - siem-data:/app/data
      - siem-reports:/app/reports
      - siem-quarantine:/app/quarantine
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "siem", "worker", "data/events.jsonl", "--output", "data/all-alerts.jsonl", "--state", "data/worker-state.json", "--incident-database", "data/siem.db", "--report", "reports/current.md", "--interval", "30"]
    environment:
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SIEM_WEBHOOK_TOKEN: ${SIEM_WEBHOOK_TOKEN:-}
    volumes:
      - siem-data:/app/data
      - siem-reports:/app/reports
      - siem-quarantine:/app/quarantine
    restart: unless-stopped

  # Optional collector: tails the host's SSH auth log into data/events.jsonl
  # for the worker. Enable with `docker compose --profile agent up -d`.
  # /var/log/auth.log is usually root:adm 0640; group 4 is `adm` on
  # Debian/Ubuntu hosts - adjust SIEM_LOG_GROUP for other distributions.
  agent:
    build: .
    profiles: ["agent"]
    command: ["python", "ingestion.py", "agent", "/host-logs/auth.log", "--format", "syslog", "--source", "host-auth", "--output", "data/events.jsonl", "--state", "data/agent-auth.state.json"]
    working_dir: /app
    group_add:
      - "${SIEM_LOG_GROUP:-4}"
    volumes:
      - siem-data:/app/data
      - ./ingestion.py:/app/ingestion.py:ro
      - /var/log:/host-logs:ro
    restart: unless-stopped

volumes:
  siem-data:
  siem-reports:
  siem-quarantine:
